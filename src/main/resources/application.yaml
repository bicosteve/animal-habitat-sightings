spring:
  application:
    name: Animal-Habitat-Sightings
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB


server:
  port: 8080

oracle:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}