
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Distance Analysis | Animal Habitats & Sightings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('analysis')}"></div>

<main class="container mt-4">

    <div class="mb-4">
        <h2>Spatial Distance Analysis</h2>
        <p class="text-muted">
            Calculate distances between animal sightings and habitats.
        </p>
    </div>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header">
                    <strong>Analysis Parameters</strong>
                </div>

                <div class="card-body">

                    <label for="sightingSelect" class="form-label">
                        Select Sighting
                    </label>
                    <select id="sightingSelect"
                            class="form-select mb-3">
                        <option value="">
                            Choose a sighting
                        </option>
                    </select>

                    <label for="habitatSelect" class="form-label">
                        Select Habitat
                    </label>
                    <select id="habitatSelect"
                            class="form-select mb-3">
                        <option value="">
                            Choose a habitat
                        </option>
                    </select>

                    <button class="btn btn-success w-100" disabled>
                        Calculate Distance
                    </button>

                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header">
                    <strong>Distance Results</strong>
                </div>

                <div class="card-body">
                    <p class="text-muted">
                        Select a sighting and habitat
                        to calculate their distance.
                    </p>

                    <div id="distanceResult"></div>
                </div>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
