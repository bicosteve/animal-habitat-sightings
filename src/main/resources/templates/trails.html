
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wildlife Trails | Animal Habitats & Sightings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* Rows link to the detail page; show a pointer to signal that. */
        tr.js-trail-row {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('trails')}"></div>

<main class="container mt-4">

    <div class="alert alert-success alert-dismissible fade show"
         role="alert"
         th:if="${success}">
        <span th:text="${success}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="alert alert-warning alert-dismissible fade show"
         role="alert"
         th:if="${warning}">
        <span th:text="${warning}">Warning</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Wildlife Trails</h2>
            <p class="text-muted mb-0">
                Manage wildlife trail paths through the map.
            </p>
        </div>

        <a th:href="@{/trails/new}" class="btn btn-success">
            + Add Trail
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong>Registered Trails</strong>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Trail Name</th>
                        <th>Description</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="trail : ${trails}"
                        class="js-trail-row"
                        th:data-href="@{'/trails/' + ${trail.trailId}}">
                        <td th:text="${trail.trailId}">1</td>
                        <td th:text="${trail.trailName}">Trail name</td>
                        <td>
                            <span th:if="${trail.description}"
                                  th:text="${trail.description}">Description</span>
                            <span th:unless="${trail.description}" class="text-muted">&mdash;</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{'/trails/' + ${trail.trailId}}">
                                View
                            </a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{'/trails/' + ${trail.trailId} + '/edit'}">
                                Edit
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(trails)}">
                        <td colspan="4" class="text-center text-muted">
                            No trails loaded yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        // Make each trail row navigate to its detail page, except when a link
        // or button inside the row is clicked.
        document.querySelectorAll('tr.js-trail-row').forEach(function (row) {
            row.addEventListener('click', function (event) {
                if (event.target.closest('a, button')) {
                    return;
                }
                const href = row.getAttribute('data-href');
                if (href) {
                    window.location.href = href;
                }
            });
        });
    })();
</script>
</body>
</html>
