
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkpoints | Animal Habitats & Sightings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('checkpoints')}"></div>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Checkpoints</h2>
            <p class="text-muted mb-0">
                Manage checkpoint locations for viewing animals.
            </p>
        </div>

        <a th:href="@{/checkpoints/new}" class="btn btn-success">
            + Add Checkpoint
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong>Registered Checkpoints</strong>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Checkpoint Name</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="checkpoint : ${checkpoints}">
                        <td th:text="${checkpoint.checkpointId}">1</td>
                        <td th:text="${checkpoint.checkpointName}">Checkpoint name</td>
                        <td th:text="${checkpoint.checkpointType}">Type</td>
                        <td th:text="${checkpoint.description}">Description</td>
                        <td><span class="text-muted">&mdash;</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(checkpoints)}">
                        <td colspan="5" class="text-center text-muted">
                            No checkpoints loaded yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
