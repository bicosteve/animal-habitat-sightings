
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkpoints | Animal Habitats & Sightings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        /* Rows link to the detail page; show a pointer to signal that. */
        tr.js-checkpoint-row {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('checkpoints')}"></div>

<main class="container mt-4">

    <div class="alert alert-success alert-dismissible fade show"
         role="alert"
         th:if="${success}">
        <span th:text="${success}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="alert alert-warning alert-dismissible fade show"
         role="alert"
         th:if="${warning}">
        <span th:text="${warning}">Warning</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Checkpoints</h2>
            <p class="text-muted mb-0">
                Manage checkpoint locations for viewing animals.
            </p>
        </div>

        <a th:href="@{/checkpoints/new}" class="btn btn-success">
            + Add Checkpoint
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong>Registered Checkpoints</strong>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Checkpoint Name</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="checkpoint : ${checkpoints}"
                        class="js-checkpoint-row"
                        th:data-href="@{'/checkpoints/' + ${checkpoint.checkpointId}}">
                        <td th:text="${checkpoint.checkpointId}">1</td>
                        <td th:text="${checkpoint.checkpointName}">Checkpoint name</td>
                        <td>
                            <span th:if="${checkpoint.checkpointType}"
                                  th:text="${checkpoint.checkpointType}">Type</span>
                            <span th:unless="${checkpoint.checkpointType}" class="text-muted">&mdash;</span>
                        </td>
                        <td>
                            <span th:if="${checkpoint.description}"
                                  th:text="${checkpoint.description}">Description</span>
                            <span th:unless="${checkpoint.description}" class="text-muted">&mdash;</span>
                        </td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{'/checkpoints/' + ${checkpoint.checkpointId}}">
                                View
                            </a>
                            <a class="btn btn-sm btn-outline-secondary"
                               th:href="@{'/checkpoints/' + ${checkpoint.checkpointId} + '/edit'}">
                                Edit
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(checkpoints)}">
                        <td colspan="5" class="text-center text-muted">
                            No checkpoints loaded yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        // Make each checkpoint row navigate to its detail page, except when a
        // link or button inside the row is clicked.
        document.querySelectorAll('tr.js-checkpoint-row').forEach(function (row) {
            row.addEventListener('click', function (event) {
                if (event.target.closest('a, button')) {
                    return;
                }
                const href = row.getAttribute('data-href');
                if (href) {
                    window.location.href = href;
                }
            });
        });
    })();
</script>
</body>
</html>
