
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Wildlife Trail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css">

    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        #map { height: 400px; }
    </style>
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('trails')}"></div>

<main class="container mt-4">

    <h2>Add Wildlife Trail</h2>
    <p class="text-muted">
        Enter the details, then draw the trail line on the map.
    </p>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/trails}"
                  th:object="${trail}"
                  method="post"
                  id="trailForm">

                <div class="mb-3">
                    <label for="trailName" class="form-label">
                        Trail Name
                    </label>

                    <input type="text"
                           class="form-control"
                           id="trailName"
                           th:field="*{trailName}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea class="form-control"
                              id="description"
                              th:field="*{description}"
                              rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Trail Line</label>
                    <div id="map" class="border rounded"></div>
                </div>

                <input type="hidden" id="sdo_gtype" th:field="*{sdo_gtype}">
                <input type="hidden" id="sdo_srid" th:field="*{sdo_srid}">
                <input type="hidden" id="sdo_elem_info" th:field="*{sdo_elem_info}">
                <input type="hidden" id="sdo_ordinates" th:field="*{sdo_ordinates}">

                <div id="geometryStatus" class="alert alert-info">
                    Draw the geometry on the map to continue.
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        Save Trail
                    </button>

                    <a th:href="@{/trails}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.js"></script>
<script th:src="@{/js/geometry-draw.js}"></script>
<script th:src="@{/js/geometry-form-init.js}"
        data-map-id="map"
        data-shape="line"></script>
</body>
</html>
