
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? 'Edit Animal' : 'Add Animal'">Add Animal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('animals')}"></div>

<main class="container mt-4">

    <h2 th:text="${editing} ? 'Edit Animal' : 'Add Animal'">Add Animal</h2>
    <p class="text-muted"
       th:text="${editing}
                   ? 'Update this animal\'s name or description.'
                   : 'Register a new animal species.'">
        Register a new animal species.
    </p>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="${editing}
                              ? @{/animals/{id}(id=${animal.animalId})}
                              : @{/animals}"
                  th:object="${animal}"
                  method="post"
                  id="animalForm">

                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}"
                         th:text="${err}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="animalName" class="form-label">
                        Animal Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('animalName')} ? 'is-invalid'"
                           id="animalName"
                           th:field="*{animalName}"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('animalName')}"
                         th:errors="*{animalName}">Name error</div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>

                    <textarea class="form-control"
                              id="description"
                              th:field="*{description}"
                              rows="3"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success"
                            th:text="${editing} ? 'Update Animal' : 'Save Animal'">
                        Save Animal
                    </button>

                    <a th:href="@{/animals}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
