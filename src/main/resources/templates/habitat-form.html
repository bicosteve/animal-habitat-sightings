
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Habitat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('habitats')}"></div>

<main class="container mt-4">

    <h2>Add Habitat</h2>
    <p class="text-muted">
        Register a new animal habitat.
    </p>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/habitats}"
                th:object="${habitat}"
                method="post"
                id="habitatForm">

                <div class="mb-3">
                    <label for="habitatName" class="form-label">
                        Habitat Name
                    </label>

                    <input type="text"
                           class="form-control"
                           id="habitatName"
                           th:field="*{habitatName}"
                           required>
                </div>

                <div class="mb-3">
                    <label for="animalId" class="form-label">
                        Animal ID
                    </label>

                    <input type="number"
                           id="animalId"
                           class="form-control"
                           th:field="*{animalId}"
                           min="1"
                           required>
                </div>

                <div class="mb-3">
                    <label for="geometrySelect" class="form-label">
                        Select Habitat Polygon
                    </label>

                    <select id="geometrySelect" class="form-select" required>
                        <option value="">Choose a polygon</option>
                    </select>
                </div>

                <input type="hidden" id="sdo_gtype"
                       th:field="*{sdo_gtype}">

                <input type="hidden" id="sdo_srid"
                       th:field="*{sdo_srid}">

                <input type="hidden" id="sdo_elem_info"
                       th:field="*{sdo_elem_info}">

                <input type="hidden" id="sdo_ordinates"
                       th:field="*{sdo_ordinates}">

                <div id="geometryStatus" class="alert alert-info">
                    Loading selected geometry...
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        Save Habitat
                    </button>

                                        <a th:href="@{/habitats}"
                                           class="btn btn-outline-secondary">
                                            Cancel
                                        </a>
                </div>

            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/habitat-form.js}"></script>
</body>
</html>
