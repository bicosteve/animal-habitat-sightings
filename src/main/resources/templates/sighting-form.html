
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Sighting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet"
          href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css">

    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        #map { height: 400px; }
    </style>
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar('sightings')}"></div>

<main class="container mt-4">

    <h2>Add Sighting</h2>
    <p class="text-muted">
        Record an animal observation, then mark where it was seen on the map.
    </p>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/sightings}"
                  th:object="${sighting}"
                  method="post"
                  enctype="multipart/form-data"
                  id="sightingForm">

                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}"
                         th:text="${err}">Error</div>
                </div>

                <div class="mb-3">
                    <label for="animalId" class="form-label">
                        Animal
                    </label>

                    <select id="animalId"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('animalId')} ? 'is-invalid'"
                            th:field="*{animalId}"
                            required>
                        <option value="">Select an animal</option>
                        <option th:each="animal : ${animals}"
                                th:value="${animal.animalId}"
                                th:text="${animal.animalName}">Animal</option>
                    </select>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('animalId')}"
                         th:errors="*{animalId}">Animal error</div>

                    <div class="form-text" th:if="${#lists.isEmpty(animals)}">
                        No animals yet.
                        <a th:href="@{/animals/new}">Add an animal first</a>.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="sightedAt" class="form-label">
                        Date &amp; Time
                    </label>

                    <input type="datetime-local"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('sightedAt')} ? 'is-invalid'"
                           id="sightedAt"
                           th:field="*{sightedAt}"
                           required>

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('sightedAt')}"
                         th:errors="*{sightedAt}">Date error</div>
                </div>

                <div class="mb-3">
                    <label for="image" class="form-label">
                        Photo <span class="text-muted">(optional)</span>
                    </label>

                    <input type="file"
                           class="form-control"
                           id="image"
                           name="image"
                           accept=".png,.jpg,.jpeg,image/png,image/jpeg">

                    <div class="form-text">
                        PNG or JPEG only, up to 5&nbsp;MB.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sighting Location</label>
                    <div id="map" class="border rounded"></div>
                </div>

                <input type="hidden" id="sdo_gtype" th:field="*{sdo_gtype}">
                <input type="hidden" id="sdo_srid" th:field="*{sdo_srid}">
                <input type="hidden" id="sdo_elem_info" th:field="*{sdo_elem_info}">
                <input type="hidden" id="sdo_ordinates" th:field="*{sdo_ordinates}">

                <div class="alert alert-danger"
                     th:if="${#fields.hasErrors('sdo_elem_info') or #fields.hasErrors('sdo_ordinates')}">
                    <span th:if="${#fields.hasErrors('sdo_elem_info')}" th:errors="*{sdo_elem_info}">Geometry error</span>
                    <span th:if="${#fields.hasErrors('sdo_ordinates') and !#fields.hasErrors('sdo_elem_info')}" th:errors="*{sdo_ordinates}">Geometry error</span>
                </div>

                <div id="geometryStatus" class="alert alert-info">
                    Mark the sighting location on the map to continue.
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        Save Sighting
                    </button>

                    <a th:href="@{/sightings}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.js"></script>
<script th:src="@{/js/geometry-draw.js}"></script>
<script th:src="@{/js/geometry-form-init.js}"
        data-map-id="map"
        data-shape="point"></script>
</body>
</html>
