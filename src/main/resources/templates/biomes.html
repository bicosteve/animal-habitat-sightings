
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Biomes | Animal Habitats & Sightings</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('biomes')}"></div>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Biomes</h2>
            <p class="text-muted mb-0">
                Manage biome regions and their boundaries.
            </p>
        </div>

        <a th:href="@{/biomes/new}" class="btn btn-success">
            + Add Biome
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <strong>Registered Biomes</strong>
        </div>

        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Biome Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="biome : ${biomes}">
                        <td th:text="${biome.biomeId}">1</td>
                        <td th:text="${biome.biomeName}">Biome name</td>
                        <td th:text="${biome.description}">Description</td>
                        <td><span class="text-muted">&mdash;</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(biomes)}">
                        <td colspan="4" class="text-center text-muted">
                            No biomes loaded yet.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
